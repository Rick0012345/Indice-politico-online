services:
  app:
    image: catalogo-politico-dev:latest
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      - RUN_PRISMA_MIGRATIONS=false
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
      - VITE_USE_POLLING=true
      - VITE_API_PROXY_TARGET=http://api:4000
      - APP_DB_HOST=db
      - APP_DB_PORT=5432
      - APP_DB_USER=app
      - APP_DB_PASSWORD=app
      - APP_DB_NAME=app
      - DATABASE_URL=postgresql://app:app@db:5432/app?schema=catalogo&options=-c%20search_path%3Dcatalogo%2Cpublic
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    stdin_open: true
    tty: true

  api:
    image: catalogo-politico-dev:latest
    build:
      context: .
      target: development
    command: npm run api:dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      - RUN_PRISMA_MIGRATIONS=true
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-change-me-local-admin-token}
      - HOST=0.0.0.0
      - PORT=4000
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
      - APP_DB_HOST=db
      - APP_DB_PORT=5432
      - APP_DB_USER=app
      - APP_DB_PASSWORD=app
      - APP_DB_NAME=app
      - DATABASE_URL=postgresql://app:app@db:5432/app?schema=catalogo&options=-c%20search_path%3Dcatalogo%2Cpublic
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_node_modules:
  api_node_modules:
  app_db_data:
